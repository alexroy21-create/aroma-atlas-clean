<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraterworks → PerfumersWorld</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Inter', system-ui, sans-serif; background: #f0f4ff; color: #1a1a2e; min-height: 100vh; }

  #tabs { display:flex; background:#fff; border-bottom:2px solid #e0e7ff; position:sticky; top:0; z-index:20; box-shadow:0 2px 8px #6c47ff11; }
  .tab { flex:1; padding:12px 6px; text-align:center; font-size:12px; font-weight:700; color:#888; border:none; background:none; cursor:pointer; border-bottom:3px solid transparent; transition:all 0.2s; }
  .tab.active { color:#6c47ff; border-bottom-color:#6c47ff; }

  #header { background:linear-gradient(135deg,#6c47ff 0%,#3b82f6 60%,#06b6d4 100%); border-bottom:2px solid #a78bfa; padding:16px 14px 12px; box-shadow:0 4px 20px #6c47ff33; }
  #header h1 { font-size:16px; font-weight:800; color:#fff; display:flex; align-items:center; gap:8px; }
  #header p  { font-size:11px; color:#dde8ff; margin:3px 0 10px; }
  #save-indicator { font-size:11px; font-weight:700; transition:color 0.3s; }

  .pill-row { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:7px; }
  .pill { padding:4px 11px; border-radius:20px; border:none; cursor:pointer; font-size:10px; font-weight:700; background:#ffffff33; color:#e8f0ff; transition:all 0.15s; }
  .pill.active { color:#fff; box-shadow:0 2px 8px #0003; }
  #search { width:100%; max-width:320px; padding:8px 14px; border-radius:20px; background:#ffffffcc; border:none; color:#1a1a2e; font-size:13px; outline:none; box-shadow:0 2px 8px #0002; }
  #search::placeholder { color:#7090b0; }

  #list { max-width:860px; margin:0 auto; padding:12px 10px 40px; }
  .card { border-radius:14px; margin-bottom:9px; padding:13px 12px; display:flex; align-items:flex-start; gap:8px; transition:all 0.2s; border:1.5px solid #d0d8f0; background:#fff; box-shadow:0 2px 10px #6c47ff11; border-left-width:4px; }
  .card.out { opacity:0.5; }
  .card-num { font-size:10px; color:#b0b8d0; min-width:18px; padding-top:4px; text-align:right; flex-shrink:0; font-weight:600; }
  .card-body { flex:1; min-width:0; }
  .card-name { font-weight:700; font-size:13px; color:#1a1a2e; margin-bottom:5px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .card-name.struck { text-decoration:line-through; color:#999; }
  .badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; }
  .match-badge { font-size:9px; padding:2px 6px; border-radius:8px; }
  .row { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:5px; }
  .size-badge  { background:#eff3ff; border:1px solid #c7d2fe; color:#4f46e5; font-family:monospace; font-size:11px; padding:3px 8px; border-radius:6px; font-weight:600; }
  .price-badge { background:#f0fdf4; border:1px solid #86efac; color:#16a34a; font-family:monospace; font-size:11px; font-weight:800; padding:3px 8px; border-radius:6px; }
  .pure-badge  { background:#fffbeb; border:1px solid #fcd34d; color:#b45309; font-family:monospace; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; }
  .low-badge   { background:#fef3c7; border:1px solid #f59e0b; color:#92400e; font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; display:inline-block; }
  .b-instock  { background:#dcfce7; border:1px solid #86efac; color:#15803d; }
  .b-outstock { background:#fee2e2; border:1px solid #fca5a5; color:#dc2626; }
  .b-cheaper  { background:#cffafe; border:1px solid #67e8f9; color:#0e7490; }
  .b-pricier  { background:#ffedd5; border:1px solid #fdba74; color:#c2410c; }
  .b-same     { background:#ede9fe; border:1px solid #c4b5fd; color:#7c3aed; }
  .pw-link { font-size:12px; margin-bottom:3px; }
  .pw-link a { color:#4f46e5; text-decoration:none; font-weight:600; }
  .note { font-size:10px; color:#8090b0; margin-top:3px; line-height:1.5; }
  .controls { display:flex; flex-direction:column; gap:6px; flex-shrink:0; align-items:center; }
  .ctrl-row  { display:flex; gap:5px; }
  .btn { padding:10px 12px; border-radius:10px; border:1.5px solid transparent; cursor:pointer; font-size:16px; font-weight:800; line-height:1; min-width:44px; min-height:44px; transition:all 0.15s; }
  .btn-check-on    { background:#22c55e; color:#fff; border-color:#16a34a; box-shadow:0 2px 10px #22c55e55; }
  .btn-check-off   { background:#f0fdf4; color:#86efac; border-color:#bbf7d0; }
  .btn-cross-on    { background:#ef4444; color:#fff; border-color:#dc2626; box-shadow:0 2px 10px #ef444455; }
  .btn-cross-off   { background:#fef2f2; color:#fca5a5; border-color:#fecaca; }
  .btn-cheaper-on  { background:#06b6d4; color:#fff; border-color:#0891b2; box-shadow:0 2px 10px #06b6d455; }
  .btn-cheaper-off { background:#ecfeff; color:#a5f3fc; border-color:#cffafe; }
  .btn-same-on     { background:#a855f7; color:#fff; border-color:#9333ea; box-shadow:0 2px 10px #a855f755; }
  .btn-same-off    { background:#faf5ff; color:#d8b4fe; border-color:#ede9fe; }
  .btn-pricier-on  { background:#f97316; color:#fff; border-color:#ea580c; box-shadow:0 2px 10px #f9731655; }
  .btn-pricier-off { background:#fff7ed; color:#fed7aa; border-color:#ffedd5; }
  .open-btn { padding:8px 10px; border-radius:10px; background:linear-gradient(135deg,#6c47ff,#3b82f6); border:none; color:#fff; font-size:14px; text-decoration:none; font-weight:800; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px #6c47ff44; }
  #footer { margin-top:18px; color:#b0b8d0; font-size:10px; text-align:center; padding-bottom:20px; }
  #no-results { text-align:center; color:#b0b8d0; margin-top:40px; display:none; font-size:14px; }

  /* ── FORMULAS PAGE ── */
  #page-formulas { display:none; max-width:900px; margin:0 auto; padding:16px 12px 40px; }
  .formula-card { background:#fff; border-radius:16px; margin-bottom:24px; box-shadow:0 2px 16px #6c47ff18; overflow:hidden; }
  .formula-header { padding:14px 16px 12px; }
  .formula-title { font-size:17px; font-weight:800; color:#1a1a2e; margin-bottom:2px; }
  .formula-sub { font-size:11px; color:#888; margin-bottom:8px; }
  .formula-desc { font-size:12px; color:#444; line-height:1.6; background:#f8f9ff; padding:10px 12px; border-radius:8px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:linear-gradient(135deg,#6c47ff,#3b82f6); color:#fff; padding:8px 10px; text-align:left; font-weight:700; font-size:11px; }
  td { padding:8px 10px; border-bottom:1px solid #f0f0ff; vertical-align:middle; }
  tr:nth-child(even) td { background:#f8f9ff; }
  .order-links { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .link-fw { display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:8px; background:linear-gradient(135deg,#7c3aed,#6c47ff); color:#fff; text-decoration:none; font-size:11px; font-weight:700; white-space:nowrap; }
  .link-pw { display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:8px; background:linear-gradient(135deg,#0891b2,#06b6d4); color:#fff; text-decoration:none; font-size:11px; font-weight:700; white-space:nowrap; }
  .link-na { display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:8px; background:#f3f4f6; color:#9ca3af; font-size:11px; font-weight:700; white-space:nowrap; }
  .qty-needed { font-size:11px; font-weight:800; color:#1a1a2e; white-space:nowrap; }
  .qty-note { font-size:10px; color:#888; }
  .formula-note { font-size:11px; color:#555; padding:10px 14px 14px; line-height:1.7; background:#f8f9ff; border-top:1px solid #e0e7ff; }
  .avail-yes { color:#16a34a; font-weight:700; font-size:11px; }
  .avail-no  { color:#dc2626; font-weight:700; font-size:11px; }
  .avail-alt { color:#d97706; font-weight:700; font-size:11px; }
</style>
</head>
<body>

<div id="tabs">
  <button class="tab active" onclick="showPage('checker',this)">🧪 PW Checker</button>
  <button class="tab"        onclick="showPage('formulas',this)">📋 Formulas</button>
</div>
